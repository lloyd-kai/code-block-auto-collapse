name: Bug report
description: Something is broken or behaves differently than described
title: "[Bug] "
labels: ["bug", "needs info"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The details below are what make a bug actionable —
        without a version and a reproduction there is usually nothing to investigate.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you file
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest release of the plugin.
          required: true

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Settings → Community plugins → Code Block Auto Collapse.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Settings → General → Check for updates, or the About dialog. Must be 1.13.0 or newer.
      placeholder: "1.13.0"
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Operating system
      placeholder: "Windows 11 / macOS 15.2 / Android 14 / iOS 18"
    validations:
      required: true

  - type: dropdown
    id: theme
    attributes:
      label: Theme
      description: Settings → Appearance. Some reports only reproduce in one theme.
      options:
        - Obsidian default, light
        - Obsidian default, dark
        - Third-party theme
      default: 0
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: snippet
    attributes:
      label: Minimal code block that reproduces it
      description: |
        Paste the fenced code block. A minimal one is far more useful than the real
        document — most reports come down to length, language, or indentation.
      render: markdown
    validations:
      required: false

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: "`Ctrl`/`Cmd` + `Shift` + `I` → Console. Paste any error, red or not."
      render: text
    validations:
      required: false

  - type: input
    id: settings
    attributes:
      label: Non-default settings
      description: Anything you changed under Settings → Code Block Auto Collapse, or "none".
      placeholder: "e.g. pixels per line 6, height mode Fit"
    validations:
      required: false
