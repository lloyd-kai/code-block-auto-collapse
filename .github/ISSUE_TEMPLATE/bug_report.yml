name: Bug report
description: Something is broken or behaves differently than described
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: Settings → Community plugins → Code Block Auto Collapse.
    validations:
      required: true

  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      description: Find it in Settings → General or the About dialog.
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: Platform and OS version
      placeholder: "e.g. macOS 15.2"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include a small example code block if it helps reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Logs, screenshots or settings
      description: Share any relevant console output, screenshots, theme or plugin settings. Remove private note content before posting.
