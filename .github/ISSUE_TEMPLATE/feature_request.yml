name: Feature request
description: Suggest a capability the plugin does not have
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior
      description: What should the plugin do in that situation?
    validations:
      required: true
