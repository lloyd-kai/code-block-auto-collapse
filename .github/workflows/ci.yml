# 每次推送与 PR 都跑一遍 lint / test / build，覆盖 Linux、Windows 与 macOS。
#
# 为什么需要平台矩阵：原开发环境是 Windows，macOS 也是开发目标，而发布跑在
# ubuntu-latest。只在一个平台上验证过的代码，很容易把平台差异带进发布流程。
# 真实案例：tools/smoke-test.mjs 曾用 `new URL(...).pathname.replace(/^\//, "")`
# 把文件 URL 转成本地路径 —— Windows 下得到 `C:/Users/...`（碰巧还是绝对路径），
# Linux 下得到 `home/runner/...`（不以 ./ 开头的裸说明符），esbuild 直接
# "Could not resolve" 退出。本地 38/38 全绿，打 tag 后 release 工作流挂在
# Lint and test 这一步。平台矩阵就是用来挡住这类"只在本地是对的"的代码。
#
# 转路径一律用 node:url 的 fileURLToPath / pathToFileURL，不要手写 pathname。
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

# 同一分支连续推送时取消掉旧的运行，省额度也少噪音。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了也把其余平台跑完，便于一次看清差异。
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  package:
    name: Package and validate submission
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # release 会 build，并保证「根目录 main.js / release/ 目录 / ZIP 内」
      # 三份产物哈希一致；validate 再按官方提交要求逐条核对 manifest 与 ZIP 结构。
      # 这两步就是自动审核扫描器会看的东西，别等提交了才发现。
      - name: Build, package and validate
        run: npm run release

      - name: Validate submission constraints
        run: npm run validate

      - name: Upload release zip
        # v6 起才改用 Node.js 24；v4 仍指向 Node.js 20，运行器会强制它跑在
        # Node 24 上并每次都报一条弃用告警。与本仓库其他 action（checkout@v7、
        # setup-node@v7）保持一致用 v7。
        uses: actions/upload-artifact@v7
        with:
          name: plugin-zip
          path: code-block-auto-collapse-*.zip
          if-no-files-found: error
